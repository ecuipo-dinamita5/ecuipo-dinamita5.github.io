<!DOCTYPE html>

<head>

  <title>Integrantes del equipo</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      margin: 0;
      padding: 24px;
    }

    h1 {
      text-align: center;
      margin-bottom: 24px;
    }

    table {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
      border-collapse: collapse;
      background: #fff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      border-radius: 10px;
      overflow: hidden;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: #e9eef5;
      font-size: 1rem;
    }

    tr:last-child td {
      border-bottom: none;
    }

    td:first-child {
      width: 130px;
      text-align: center;
    }

    td img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
      border: 2px solid #ddd;
      display: block;
      margin: 0 auto;
    }

    .nombre {
      font-size: 1.05rem;
      font-weight: 600;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      th, td { padding: 10px; }
      td:first-child { width: 95px; }
      td img { width: 76px; height: 76px; }
    }
  </style>
</head>
